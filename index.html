<!DOCTYPE html>
<!-- saved from url=(0056)https://danielgomeslab.github.io/TabelaVendass/ -->
<html lang="pt-br"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Orçamentos - Bombeiros</title>
    <style>
        :root {
            --bg-body: #440000;
            --bg-card: #6c120b;
            --bg-item: #932517;
            --input-bg: #bb3722;
            --primary: #3b82f6;
            --accent: #10b981;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
            flex: 1;
        }

        .calculadora { flex: 2; }

        .section {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
        }

        .logo-img {
            height: 150px;
            width: 150;
        }

        h3 { margin: 0 0 15px 0; color: var(--text-dim); font-size: 1rem; }

        .item-linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-item);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .label-preco { color: var(--accent); font-weight: 500; margin-left: 8px; }

        .controles { display: flex; align-items: center; gap: 12px; }
        .btn-qty {
            background: var(--danger); border: none; color: white;
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
            font-weight: bold;
        }
        .btn-qty.plus { background: var(--accent); }
        .qty-val { width: 40px; text-align: center; background: transparent; border: none; color: white; font-size: 1.1rem; }

        .resumo {
            flex: 1;
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .resumo-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }

        .total-valor { font-size: 2.2rem; color: var(--accent); font-weight: bold; margin-top: 5px; }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            border-top: 1px solid #334155;
            color: var(--text-dim);
            font-size: 0.9rem;
            width: 100%;
            max-width: 1200px;
        }

        .dev-name {
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<header>
    <img src="./South Custom_files/southcustom.png" alt="Logo South Custom" class="logo-img">
</header>

<div class="container">
    <div class="calculadora">
        <div class="section">
            <h3>🛒 Produtos</h3>
            
            <div class="item-linha">
                <span>Kit Medico <span class="label-preco">R$ 2.500,00</span></span>
                <div class="controles">
                    <button class="btn-qty" onclick="alterarQty(&#39;qtyKitMedico&#39;, -1)">-</button>
                    <input type="number" id="qtyKitMedico" class="qty-val" value="0" min="0" oninput="calcular()">
                    <button class="btn-qty plus" onclick="alterarQty(&#39;qtyKitMedico&#39;, 1)">+</button>
                </div>
            </div>

            <div class="item-linha">
                <span>Analgésico <span class="label-preco">R$ 1.000,00</span></span>
                <div class="controles">
                    <button class="btn-qty" onclick="alterarQty(&#39;qtyAnalgésico&#39;, -1)">-</button>
                    <input type="number" id="qtyAnalgésico" class="qty-val" value="0" min="0" oninput="calcular()">
                    <button class="btn-qty plus" onclick="alterarQty(&#39;qtyAnalgésico&#39;, 1)">+</button>
                </div>
            </div>
            
            <div class="item-linha">
                <span>Alcool em Gel <span class="label-preco">R$ 2.000,00</span></span>
                <div class="controles">
                    <button class="btn-qty" onclick="alterarQty(&#39;qtyAlcoolGel&#39;, -1)">-</button>
                    <input type="number" id="qtyAlcoolGel" class="qty-val" value="0" min="0" oninput="calcular()">
                    <button class="btn-qty plus" onclick="alterarQty(&#39;qtyAlcoolGel&#39;, 1)">+</button>
                </div>
            </div>

            <div class="item-linha">
                <span>Bolsa Medica <span class="label-preco">R$ 6.000,00</span></span>
                <div class="controles">
                    <button class="btn-qty" onclick="alterarQty(&#39;qtyBolsaMedica&#39;, -1)">-</button>
                    <input type="number" id="qtyBolsaMedica" class="qty-val" value="0" min="0" oninput="calcular()">
                    <button class="btn-qty plus" onclick="alterarQty(&#39;qtyBolsaMedica&#39;, 1)">+</button>
                </div>
            </div>

            <div class="item-linha">
                <span>Bandagem <span class="label-preco">R$ 2.000,00</span></span>
                <div class="controles">
                    <button class="btn-qty" onclick="alterarQty(&#39;qtyBandagem&#39;, -1)">-</button>
                    <input type="number" id="qtyBandagem" class="qty-val" value="0" min="0" oninput="calcular()">
                    <button class="btn-qty plus" onclick="alterarQty(&#39;qtyBandagem&#39;, 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="resumo">
        <h3>Resumo do Orçamento</h3>
        <div class="resumo-item">
            <span>Produtos:</span>
            <span id="resProdutos">R$&nbsp;0,00</span>
        </div>

        <div class="total-label" style="margin-top:20px; font-weight:bold;">Total Final:</div>
        <div class="total-valor" id="totalFinal">R$&nbsp;0,00</div>
    </div>
</div>

<footer>
    <p>Projeto Exclusivo © 2026 | Desenvolvido com muita dedicação por 
        <span class="dev-name">Daniel Gomes</span>
    </p>
</footer>

<script>
    function formatarMoeda(valor) {
        return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function alterarQty(id, delta) {
        const input = document.getElementById(id);
        if(!input) return;
        let valorAtual = parseInt(input.value) || 0; 
        let novoValor = valorAtual + delta;
        if (novoValor < 0) novoValor = 0;
        input.value = novoValor;
        calcular();
    }

    function calcular() {
        // Tenta buscar o valor base, se estiver comentado assume 0
        const inputBase = document.getElementById('valorBase');
        let baseOriginal = inputBase ? (parseInt(inputBase.value.replace(/\D/g, "")) || 0) : 0;
        
        // Lógica de preços atualizada conforme os novos valores do print
        let totalProdutos = 
            ((parseInt(document.getElementById('qtyKitMedico')?.value) || 0) * 2500) +
            ((parseInt(document.getElementById('qtyAnalgésico')?.value) || 0) * 1000) +
            ((parseInt(document.getElementById('qtyAlcoolGel')?.value) || 0) * 2000) +
            ((parseInt(document.getElementById('qtyBolsaMedica')?.value) || 0) * 6000) +
            ((parseInt(document.getElementById('qtyBandagem')?.value) || 0) * 2000);

        let totalFinal = baseOriginal + totalProdutos;

        // Atualiza os campos de texto no resumo
        const resProdutos = document.getElementById('resProdutos');
        if (resProdutos) resProdutos.innerText = formatarMoeda(totalProdutos);
        
        const resTotal = document.getElementById('totalFinal');
        if (resTotal) resTotal.innerText = formatarMoeda(totalFinal);
    }

    // Inicia o cálculo zerado ao carregar a página
    window.onload = calcular;
</script>

</body></html>
